<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ArcheaAge UI Studio</title>
<style>
  :root {
    --bg:#07100d; --bg2:#0b1512; --surface:#101a17; --surface-el:#141f1b; --input:#0a1210;
    --primary:#8dbb3e; --primary-d:#496d27; --gold-l:#d3c58a; --text-gd:#c6b77b;
    --text:#e7e5d9; --text2:#aaa99d; --textm:#777970;
    --brd:rgba(150,180,100,.14); --ff-d:"Cinzel",Georgia,serif; --ff-u:"Inter",system-ui,sans-serif;
  }
  * { box-sizing:border-box; font-family:var(--ff-u); font-size:13px; }
  html,body { margin:0; height:100%; overflow:hidden; }
  body { background:var(--bg); color:var(--text); display:flex; flex-direction:column; }

  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-track { background:#0a1210; }
  ::-webkit-scrollbar-thumb { background:#2e3b2f; border-radius:5px; border:2px solid #0a1210; }
  ::-webkit-scrollbar-thumb:hover { background:var(--primary-d); }

  #tb { height:38px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
        background:var(--bg2); border-bottom:1px solid var(--brd); user-select:none; }
  #tb .name { font-family:var(--ff-d); font-size:12px; letter-spacing:3px; color:var(--text-gd);
              padding-left:16px; text-transform:uppercase; }
  #tb .btns { display:flex; height:100%; }
  #tb .btns div { width:42px; display:grid; place-items:center; cursor:pointer; color:var(--text2); }
  #tb .btns div:hover { background:#ffffff10; color:var(--text); }
  #tb .btns .close:hover { background:#8e4e4e; color:#fff; }

  main { flex:1; display:grid; grid-template-columns:280px 1fr 320px; min-height:0; }

  /* tree */
  #treePane { background:var(--bg2); border-right:1px solid var(--brd); overflow:auto; padding:10px 8px; }
  #treePane h4 { margin:8px 0 6px; font-size:11px; color:var(--textm); letter-spacing:1px; text-transform:uppercase; }
  .tnode { padding:3px 6px; border-radius:4px; cursor:pointer; font-size:12px; }
  .tnode:hover { background:#ffffff08; }
  .tnode.sel { background:var(--primary-d); color:#fff; }

  /* canvas — renders the reconstructed game screen */
  #canvasWrap { position:relative; overflow:hidden; background:#000; }
  #renderer { position:absolute; width:1920px; height:1080px; transform-origin:0 0;
              background-size:cover; background-position:center; }
  #renderer img.bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; pointer-events:none; }

  /* overlay widgets rendered on top of bg */
  .ow { position:absolute; cursor:pointer; z-index:5; }
  .ow:hover { outline:1px solid var(--primary); outline-offset:-1px; }
  .ow.sel-out { outline:2px solid var(--acc,#e8b23a); outline-offset:-1px; z-index:7; }
  .ow-label { white-space:nowrap; text-shadow:0 1px 3px #000c, 0 0 6px rgba(0,0,0,.5);
              pointer-events:none; }

  /* selection highlight */
  .sel-ring { position:absolute; border:2px solid var(--primary); pointer-events:none; z-index:8;
              box-shadow:0 0 0 9999px rgba(0,0,0,.06); }

  /* inspector */
  #inspector { background:var(--surface); border-left:1px solid var(--brd); padding:14px; overflow:auto; }
  #inspector h3 { font-family:var(--ff-d); font-size:11px; letter-spacing:2px; text-transform:uppercase;
                  color:var(--text-gd); margin:0 0 12px; }
  #inspector label { display:block; font-size:11px; color:var(--textm); margin:10px 0 3px; }
  #inspector input[type=text], #inspector input[type=number], #inspector select,
  #inspector textarea { width:100%; background:var(--input); color:var(--text); border:1px solid var(--brd);
                        padding:5px 8px; border-radius:4px; font-size:12px; }
  #inspector input[type=color] { width:48px; height:28px; padding:2px; background:var(--input);
                                 border:1px solid var(--brd); border-radius:4px; cursor:pointer; }
  #inspector button { background:var(--surface-el); color:var(--text); border:1px solid var(--brd);
                      padding:7px 10px; border-radius:4px; cursor:pointer; width:100%;
                      margin-top:8px; font-size:12px; }
  #inspector button:hover { border-color:var(--primary); }
  #inspector button.primary { background:var(--primary-d); border-color:var(--primary-d); font-weight:600; }
  .kv { font-size:11px; color:var(--text2); margin:3px 0; word-break:break-all; }
  .status { min-height:16px; margin-top:12px; font-size:11px; color:var(--on); word-break:break-all; }

  /* intro */
  #intro { position:fixed; inset:0; background:rgba(5,10,8,.92); display:flex;
           align-items:center; justify-content:center; z-index:50; }
  #intro .card { width:520px; background:var(--surface); border:1px solid var(--brd); border-radius:8px; padding:28px 32px; }
  #intro h2 { font-family:var(--ff-d); color:var(--gold-l); margin:0 0 6px; letter-spacing:2px; }
</style>
</head>
<body>

<div id="tb">
  <span class="name">ArcheaAge · UI Studio</span>
  <div class="btns">
    <div onclick="winAction('minimize')">—</div>
    <div onclick="winAction('toggleMaximize')">□</div>
    <div class="close" onclick="winAction('close')">✕</div>
  </div>
</div>

<main>
  <div id="treePane"></div>
  <div id="canvasWrap">
    <div id="renderer"></div>
  </div>
  <div id="inspector"></div>
</main>

<div id="intro" style="position:fixed;inset:0;background:rgba(5,10,8,.92);display:flex;align-items:center;justify-content:center;z-index:50;">
  <div style="width:520px;background:var(--surface);border:1px solid var(--brd);border-radius:8px;padding:28px 32px;">
    <h2 style="font-family:var(--ff-d);color:var(--gold-l);margin:0 0 6px;letter-spacing:2px;">ArcheaAge · UI Studio</h2>
    <p style="color:var(--text2)">Reconstruct &amp; edit the in-game UI.</p>
    <ol style="line-height:1.9;padding-left:22px;margin:14px 0;">
      <li>Import <code>game_ui_tree.json</code></li>
      <li>Navigate the tree → select → edit properties</li>
      <li>Create custom widgets</li>
      <li><code>Export overrides.lua</code></li>
      <li><code>push-ui.ps1</code> → reopen the game</li>
    </ol>
    <button id="btnStart" class="primary" style="width:auto;padding:8px 24px;">Start</button>
  </div>
</div>

<script>
"use strict";
const $  = s => document.querySelector(s);
const IN_TAURI = !!window.__TAURI__;
const invoke = async (cmd, args) => window.__TAURI__.core.invoke(cmd, args);

function winAction(a){ try{ window.__TAURI__.window.getCurrentWindow()[a](); }catch(e){} }
function closeIntro(){ document.getElementById("intro").style.display = "none"; }
function setStatus(msg, err){
  const el = $("#status"); if(!el) return;
  el.textContent = msg || ""; el.style.color = err ? "#e08a8a" : "var(--on)";
}

/* ---------- project model ---------- */
let SCREEN_ORDER = [];
const PROJECT = { screens:{} };
let SEL = null;
let zoom = 1;

function ensureScreen(name){
  if(!PROJECT.screens[name]){ PROJECT.screens[name]={native:{},custom:[],layout:{}}; SCREEN_ORDER.push(name); }
  return PROJECT.screens[name];
}
function selObj(){
  if(!SEL) return null;
  const s = PROJECT.screens[SEL.screen]; if(!s) return null;
  return SEL.kind==="native" ? s.native[SEL.id]
       : SEL.kind==="custom" ? s.custom.find(c=>c.id===SEL.id)
       : null;
}

/* ---------- tree ---------- */
function renderTree(){
  const tp=$("#treePane"); tp.innerHTML="<h4>Screens</h4>";
  for(const scr of SCREEN_ORDER){
    const s=PROJECT.screens[scr];
    const nn=Object.keys(s.native).length;

    const head=document.createElement("div");
    head.className="tnode"+(SEL&&SEL.screen===scr&&SEL.kind==="screen"?" sel":"");
    head.innerHTML=`${scr} <span style="opacity:.55;font-size:10px;float:right">${nn}n·${s.custom.length}c</span>`;
    head.onclick=()=>{ SEL={screen:scr,kind:"screen"}; render(); };
    tp.appendChild(head);

    Object.keys(s.native).forEach(id=>{
      const d=document.createElement("div");
      d.className="tnode"+(SEL&&SEL.screen===scr&&SEL.kind==="native"&&SEL.id===id?" sel":"");
      d.style.paddingLeft="20px"; d.textContent=id;
      d.onclick=()=>{ SEL={screen:scr,kind:"native",id}; render(); };
      tp.appendChild(d);
    });

    const addC=document.createElement("div");
    addC.className="tnode"; addC.style.paddingLeft="14px";
    addC.innerHTML=`+ new widget`;
    addC.onclick=()=>{ newWidget(scr); };
    tp.appendChild(addC);

    s.custom.forEach(c=>{
      const d=document.createElement("div");
      d.className="tnode"+(SEL&&SEL.screen===scr&&SEL.kind==="custom"&&SEL.id===c.id?" sel":"");
      d.style.paddingLeft="26px"; d.textContent=c.text||c.id;
      d.onclick=()=>{ SEL={screen:scr,kind:"custom",id:c.id}; render(); };
      tp.appendChild(d);
    });
  }
}

/* ================= RENDERER — reconstructs the screen ================= */
function renderScreen(){
  const rd=$("#renderer"); rd.innerHTML="";
  if(!SCREEN_ORDER.length) return;

  // fullscreen background texture
  const bg=document.createElement("img");
  bg.className="bg"; bg.src="textures/ch_select_bg.png";
  rd.appendChild(bg);

  // overlay native widgets (from tree.json) as interactive outlines
  const scr = SEL?.screen || SCREEN_ORDER[0];
  const s = PROJECT.screens[scr]; if(!s) return;
  for(const [id,w] of Object.entries(s.native)){
    if(w.x===undefined || w.w===0) continue;
    const d=document.createElement("div"); d.className="ow";
    d.style.left=w.x+"px"; d.style.top=w.y+"px";
    d.style.width=Math.max(30,w.w)+"px"; d.style.height=Math.max(16,w.h||30)+"px";
    d.dataset.id=id;
    d.onclick=()=>{ SEL={screen:scr,kind:"native",id}; renderScreenOverlays(); renderInspector(); };
    rd.appendChild(d);
  }

  // custom widgets on top
  for(const c of s.custom){
    const d=document.createElement("div"); d.className="ow";
    d.style.left=c.x+"px"; d.style.top=c.y+"px";
    d.style.width=(c.w||180)+"px"; d.style.height=(c.h||30)+"px";
    d.dataset.id=c.id;
    const lbl=document.createElement("div"); lbl.className="ow-label";
    lbl.style.color=c.color||"#9eb8d9"; lbl.style.fontSize="15px";
    lbl.style.fontFamily="'Trebuchet MS',sans-serif"; lbl.style.textAlign="right";
    lbl.textContent=c.text||c.id;
    d.appendChild(lbl);
    d.onclick=()=>{ SEL={screen:scr,kind:"custom",id:c.id}; renderScreenOverlays(); renderInspector(); };
    rd.appendChild(d);
  }

  // selection ring
  if(SEL && SEL.kind!=="screen"){
    const o=selObj();
    if(o && o.x!==undefined){
      const ring=document.createElement("div"); ring.className="sel-ring";
      ring.style.left=o.x+"px"; ring.style.top=o.y+"px";
      ring.style.width=(o.w||180)+"px"; ring.style.height=(o.h||30)+"px";
      rd.appendChild(ring);
    }
  }
}

function renderScreenOverlays(){ renderScreen(); renderInspector(); }

/* ================= inspector ================= */
function esc(s){ return String(s??"").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

function renderInspector(){
  const ins=$("#inspector");
  const exportBtn='<button onclick="doExport()">⬇ Export overrides.lua</button>';

  if(!SEL){
    ins.innerHTML=`<h3>Inspector</h3><p class="kv">Select an element.</p>${exportBtn}`;
    return;
  }
  const s=PROJECT.screens[SEL.screen];

  if(SEL.kind==="screen"){
    ins.innerHTML=`<h3>Screen · ${esc(SEL.screen)}</h3>
      <p class="kv">Native windows: ${Object.keys(s.native).length}</p>
      <p class="kv">Custom widgets: ${s.custom.length}</p>${exportBtn}`;
    return;
  }
  const o=selObj();

  if(SEL.kind==="native"){
    ins.innerHTML=`<h3>Native · ${esc(SEL.id)}</h3>
      <p class="kv">${o.w}×${o.h} · offset=${o.offset??"?"}</p>
      ${exportBtn}`;
    return;
  }

  ins.innerHTML=`<h3>Widget · ${esc(o.id)}</h3>
    <label>Type</label>
    <select id="i_type"><option ${o.type==="label"?"selected":""}>label</option>
    <option ${o.type==="window"?"selected":""}>window</option></select>
    <label>Text</label><textarea id="i_text">${esc(o.text)}</textarea>
    <label>Color</label><input type="color" id="i_color" value="${esc(o.color)}">
    <label>X</label><input type="number" id="i_x" value="${o.x}">
    <label>Y</label><input type="number" id="i_y" value="${o.y}">
    <label>W</label><input type="number" id="i_w" value="${o.w}">
    <label>H</label><input type="number" id="i_h" value="${o.h}">
    <label>Show</label><input type="checkbox" id="i_show" ${(o.show!==false)?"checked":""}>
    <button onclick="applyInspector()">Apply</button>
    <button style="border-color:#e08a8a;color:#e08a8a" onclick="deleteSel()">Delete</button>
    ${exportBtn}`;

  ["i_type","i_text","i_color","i_x","i_y","i_w","i_h","i_show"].forEach(id=>{
    const el=document.getElementById(id);
    el.oninput=()=>{
      const k=id.slice(2).toLowerCase();
      o[k]=(["x","y","w","h"].includes(k))?+(el.value):(id==="i_show")?el.checked:el.value;
      renderScreenOverlays();
    };
  });
}

function applyInspector(){
  const o=selObj(); if(!o) return;
  const g=id=>document.getElementById(id);
  if(g("i_anchor")) o.anchor=g("i_anchor").value;
  if(g("i_x")) o.x=+g("i_x").value;
  if(g("i_y")) o.y=+g("i_y").value;
  if(g("i_type")) o.type=g("i_type").value;
  if(g("i_text")) o.text=g("i_text").value;
  if(g("i_color")) o.color=g("i_color").value;
  if(g("i_w")) o.w=+g("i_w").value;
  if(g("i_h")) o.h=+g("i_h").value;
  if(g("i_show")) o.show=g("i_show").checked;
  renderScreenOverlays();
}

function newWidget(scr){
  const s=ensureScreen(scr);
  let i=1; while(s.custom.some(c=>c.id==="custom_"+i)) i++;
  const id="custom_"+i;
  s.custom.push({ id,type:"label",x:960,y:500+i*35,w:220,h:30,
                  text:"New widget",color:"#9eb8d9",show:true });
  SEL={screen:scr,kind:"custom",id};
  render();
}
function deleteSel(){
  if(!SEL||SEL.kind==="screen") return;
  const s=PROJECT.screens[SEL.screen];
  if(SEL.kind==="custom") s.custom=s.custom.filter(c=>c.id!==SEL.id);
  else delete s.native[SEL.id];
  SEL=null; render();
}

/* ================= export ================= */
function genLua(){
  const q=v=>'"'+String(v??"").replace(/\\/g,"\\\\").replace(/"/g,'\\"')+'"';
  const out=["-- overrides.lua \u2014 generated by ArcheaAge UI Studio","",
             "IVAN_OVERRIDES = {"];
  for(const scr of SCREEN_ORDER){
    for(const [id,w] of Object.entries(PROJECT.screens[scr].native)){
      if(w.x!==undefined)
        out.push(`    { id = "${id}", action = "apply", anchor = { "TOPLEFT", "UIParent", ${w.x}, ${w.y ?? 0} } },`);
    }
  }
  out.push("}");
  out.push("");
  out.push("IVAN_CUSTOM = {");
  for(const scr of SCREEN_ORDER){
    for(const c of PROJECT.screens[scr].custom){
      const col=c.color?`color = { ${hexToRgb01(c.color).join(", ")} },`:"";
      out.push(`    { id = "${c.id}", anchor = { "TOPLEFT", "UIParent", ${c.x}, ${c.y} }, extent = { ${c.w||180}, ${c.h||30} }, text = ${q(c.text)}, ${col} show = true },`);
    }
  }
  out.push("}");
  return out.join("\n");
}
function hexToRgb01(h){
  const m=/^#?([0-9a-f]{6})$/i.exec(h||""); if(!m) return [1,1,1];
  const n=parseInt(m[1],16), f=b=>+(b/255).toFixed(3);
  return [f((n>>16)&255), f((n>>8)&255), f(n&255)];
}
async function doExport(){
  const lua=genLua();
  if(IN_TAURI){
    try{ const p=await invoke("overrides_save",{content:lua});
         setStatus("saved: "+p+" \u2192 run tools\\ui\\push-ui.ps1"); }
    catch(e){ setStatus(String(e),true); }
  }else{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([lua],{type:"text/plain"}));
    a.download="overrides.lua"; a.click();
  }
}

/* ================= import ================= */
function importTreeData(j){
  const scr=j.screen||"world_select";
  const s=ensureScreen(scr); s.native={};
  (j.widgets||[]).forEach((w,i)=>{
    const id=w.path||w.id;
    s.native[id]={ nativeId:w.nativeId,
                   x:w.x??80+(i%5)*200, y:w.y??60+Math.floor(i/5)*90,
                   w:w.w||160, h:w.h||30, visible:w.visible!==false };
  });
  closeIntro(); render();
}
function importTreeDialog(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".json";
  inp.onchange=async()=>{
    try{ importTreeData(JSON.parse(await inp.files[0].text())); }
    catch(e){ setStatus(String(e),true); }
  }; inp.click();
}

/* ================= boot ================= */
function render(){
  renderTree();
  renderScreen();
  renderInspector();
}

$("#btnStart").onclick=closeIntro;

// auto-load tracked tree
fetch("game_ui_tree.json")
  .then(r=>r.ok?r.json():Promise.reject(r.status))
  .then(j=>importTreeData(j))
  .catch(()=>setStatus("No tree loaded yet."));

render();
</script>
</body>
</html>
