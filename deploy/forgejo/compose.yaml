# Forgejo on the VPS — private git (overlays, ops, GitHub mirrors).
# Choice: Forgejo > Gitea for a new install in 2026 — same software, non-profit
# governance (Codeberg e.V.), Gitea→Forgejo migration supported (not the
# reverse). Accepts GITEA__* env vars for compatibility.
#
# Dokploy: "Compose" service > domain -> http://forgejo:3000.
# First run:
#   docker exec -it <ctr> gitea admin user create --admin \
#     --username ivan --email you@mail --password XXX
#   (then disable public registration in the UI)
#
# .env next to this file:
#   FORGEJO_DOMAIN=git.yourdomain.com
name: forge

services:
  forgejo:
    # Pin the major; upgrades cross schema migrations — do them
    # awake and with a backup.
    image: codeberg.org/forgejo/forgejo:14
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__server__DOMAIN: ${FORGEJO_DOMAIN}
      FORGEJO__server__ROOT_URL: https://${FORGEJO_DOMAIN}
      FORGEJO__server__SSH_DOMAIN: ${FORGEJO_DOMAIN}
      FORGEJO__server__SSH_PORT: "222"
      # Embedded SQLite: correct for 1-5 users. Postgres only if it hurts.
      FORGEJO__database__DB_TYPE: sqlite3
      # Medium binaries we edit (textures, etc.); full clients NEVER here.
      FORGEJO__lfs__ENABLED: "true"
    volumes:
      - forgejo-data:/data
    ports:
      - "127.0.0.1:3000:3000" # internal HTTP; TLS by Traefik/Dokploy
      - "222:22" # git SSH direct to the VPS

volumes:
  forgejo-data:
