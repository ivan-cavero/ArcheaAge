# Garage en la VPS — S3 para artefactos: clientes base inmutables, paks,
# releases y backups (restic/rclone). NO para el repo git.
# Por qué Garage y no MinIO: MinIO entró en modo mantenimiento (dic 2025) y
# capó la consola de la CE; Garage es Rust, ligero, S3-compatible, sin sorpresas.
# Límites a conocer: sin versionado de buckets aún, subconjunto de la API S3.
# Para servir ficheros estáticos + rclone sobra de sobra.
#
# Dokploy: servicio "Compose"; expón 3900 solo por Traefik si quieres HTTPS en el API.
#
# Primera vez:
#   docker compose up -d
#   alias gr="docker exec -it garage /garage"
#   gr layout show                       # copia el NODE ID
#   gr layout assign -z dc1 -c 1 <NODE_ID>
#   gr layout apply
#   gr bucket create archeaage-artifacts
#   gr key create archeaage
#   gr bucket allow --read --write archeaage-artifacts --key archeaage
name: garage

services:
  garage:
    image: dxflrs/garage:v2.0.0
    container_name: garage
    restart: unless-stopped
    volumes:
      - ./garage.toml:/etc/garage.toml:ro # cp garage.toml.example garage.toml primero
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      - "127.0.0.1:3900:3900" # S3 API (rclone/restic/launcher)
      - "127.0.0.1:3902:3902" # web pública opcional (descargas directas)
      - "127.0.0.1:3903:3903" # admin API

volumes:
  garage-meta:
  garage-data:
