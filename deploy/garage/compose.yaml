# Garage on the VPS — S3 for artifacts: immutable base clients, paks,
# releases and backups (restic/rclone). NOT for the git repo.
# Why Garage and not MinIO: MinIO entered maintenance mode (Dec 2025) and
# crippled the CE console; Garage is Rust, light, S3-compatible, no surprises.
#
# SELF-CONTAINED for Dokploy: the garage image has NO shell (/bin/sh missing),
# so a tiny alpine init container writes /etc/garage/garage.toml from env vars
# into a shared volume. No external files to mount (Dokploy resolves relative
# paths against its own project dir, which breaks ./garage.toml).
#
# .env next to this file:
#   GARAGE_RPC_SECRET  = openssl rand -hex 32
#   GARAGE_ADMIN_TOKEN = openssl rand -hex 32
#
# First run (layout + bucket + key):
#   alias gr="docker exec -it <ctr> /garage"
#   gr layout show                       # copy the NODE ID
#   gr layout assign -z dc1 -c 1 <NODE_ID>
#   gr layout apply
#   gr bucket create archeaage-artifacts
#   gr key create archeaage
#   gr bucket allow --read --write archeaage-artifacts --key archeaage
name: garage

services:
  garage-init:
    image: alpine:3.20
    restart: "no"
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /config/garage.toml <<EOF
        metadata_dir = "/var/lib/garage/meta"
        data_dir = "/var/lib/garage/data"
        replication_factor = 1
        rpc_bind_addr = "[::]:3901"
        rpc_public_addr = "127.0.0.1:3901"
        rpc_secret = "$GARAGE_RPC_SECRET"
        [s3_api]
        s3_region = "garage"
        api_bind_addr = "[::]:3900"
        [s3_web]
        bind_addr = "[::]:3902"
        index = "index.html"
        [admin]
        api_bind_addr = "[::]:3903"
        admin_token = "$GARAGE_ADMIN_TOKEN"
        EOF
    volumes:
      - garage-config:/config

  garage:
    image: dxflrs/garage:v2.0.0
    container_name: garage
    restart: unless-stopped
    depends_on:
      garage-init:
        condition: service_completed_successfully
    command: ["/garage", "server", "-c", "/etc/garage/garage.toml"]
    volumes:
      - garage-config:/etc/garage
      - /var/lib/garage/meta:/var/lib/garage/meta
      - /var/lib/garage/data:/var/lib/garage/data
# NOTE: no host port mappings — Dokploy routes the domain via Traefik to
# garage:3900 (S3 API) over the internal network.

volumes:
  garage-config:
