# Garage on the VPS — S3 for artifacts: immutable base clients, paks,
# releases and backups (restic/rclone). NOT for the git repo.
# Why Garage and not MinIO: MinIO entered maintenance mode (Dec 2025) and
# crippled the CE console; Garage is Rust, light, S3-compatible, no surprises.
# Known limits: no bucket versioning yet, subset of the S3 API.
# For static file serving + rclone it is more than enough.
#
# Dokploy: "Compose" service; expose 3900 through Traefik only if you want
# HTTPS on the API.
#
# .env next to this file:
#   GARAGE_RPC_SECRET  = openssl rand -hex 32
#   GARAGE_ADMIN_TOKEN = openssl rand -hex 32
#
# First run:
#   docker compose up -d
#   alias gr="docker exec -it garage /garage"
#   gr layout show                       # copy the NODE ID
#   gr layout assign -z dc1 -c 1 <NODE_ID>
#   gr layout apply
#   gr bucket create archeaage-artifacts
#   gr key create archeaage
#   gr bucket allow --read --write archeaage-artifacts --key archeaage
name: garage

services:
  garage:
    image: dxflrs/garage:v2.0.0
    container_name: garage
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    volumes:
      # cp garage.toml.example garage.toml first
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      - "127.0.0.1:3900:3900" # S3 API (rclone/restic/launcher)
      - "127.0.0.1:3902:3902" # optional public web (direct downloads)
      - "127.0.0.1:3903:3903" # admin API

volumes:
  garage-meta:
  garage-data:
