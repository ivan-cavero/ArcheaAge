<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ArcheaAge UI Editor</title>
<style>
  :root { --bg:#14161a; --panel:#1d2127; --brd:#2c333c; --txt:#cfd6de; --acc:#e8b23a; }
  * { box-sizing:border-box; font-family:Segoe UI,system-ui,sans-serif; }
  body { margin:0; background:var(--bg); color:var(--txt); display:flex; height:100vh; }
  #tree { width:230px; background:var(--panel); border-right:1px solid var(--brd); overflow:auto; padding:8px; }
  #canvasWrap { flex:1; position:relative; overflow:auto; background:#0b0d10; }
  #stage { position:relative; width:1920px; height:1080px; transform-origin:0 0; background-size:100% 100%; }
  .wbox { position:absolute; border:1px dashed #4aa3ff88; background:#4aa3ff14; cursor:move; font-size:10px;
          padding:2px 4px; white-space:nowrap; overflow:hidden; }
  .wbox.sel { border:1px solid var(--acc); background:#e8b23a22; z-index:5; }
  .wbox.hidden-w { opacity:.25; border-style:dotted; }
  #props { width:280px; background:var(--panel); border-left:1px solid var(--brd); padding:12px; display:flex; flex-direction:column; gap:8px; }
  #props label { font-size:11px; color:#8b96a3; display:block; margin-top:6px; }
  #props input[type=text],#props input[type=number] { width:100%; background:#11141a; color:var(--txt); border:1px solid var(--brd); padding:4px 6px; border-radius:4px; }
  button { background:#2a313a; color:var(--txt); border:1px solid var(--brd); padding:6px 10px; border-radius:4px; cursor:pointer; width:100%; }
  button:hover { border-color:var(--acc); }
  h3 { margin:4px 0 10px; font-size:13px; letter-spacing:1px; text-transform:uppercase; color:var(--acc); }
</style>
</head>
<body>
<div id="tree"><h3>Widgets</h3><div id="treeList">Importa tree.json…</div></div>

<div id="canvasWrap">
  <div id="stage">
    <input type="file" id="shotFile" accept="image/*" style="position:absolute;top:8px;left:8px;z-index:9">
    <span style="position:absolute;top:40px;left:8px;color:#667;z-index:9;font-size:11px">fondo: captura de la pantalla del juego (opcional)</span>
  </div>
</div>

<div id="props">
  <h3>IvanPanel Editor</h3>
  <button id="btnTree">1 · Importar tree.json</button>
  <button id="btnExport">2 · Exportar overrides.lua</button>
  <hr style="border-color:var(--brd);width:100%">
  <div id="insp"><i>Selecciona un widget…</i></div>
  <hr style="border-color:var(--brd);width:100%">
  <button id="btnLua">Probar overrides en el juego</button>
  <pre style="font-size:10px;color:#7f8b98">push-ui.ps1 compila addon_panel.lua,
que lee OVERRIDES al final del fichero.</pre>
</div>

<script>
let WIDGETS = [];          // {id,parent,x,y,w,h}
let SELECTED = null;
const OVR = {};            // id -> {x,y,w,h,hidden,text,color}

const $ = s => document.querySelector(s);
const stage = $("#stage");

$("#shotFile").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  stage.style.backgroundImage = `url(${URL.createObjectURL(f)})`;
};

function render() {
  stage.querySelectorAll(".wbox").forEach(n => n.remove());
  for (const w of WIDGETS) {
    const o = OVR[w.id] || {};
    const d = document.createElement("div");
    d.className = "wbox" + (o.hidden ? " hidden-w" : "") + (SELECTED === w.id ? " sel" : "");
    d.style.left = (o.x ?? w.x ?? 40) + "px";
    d.style.top = (o.y ?? w.y ?? 40) + "px";
    d.style.width = Math.max(30, o.w ?? w.w ?? 160) + "px";
    d.style.height = Math.max(14, o.h ?? w.h ?? 24) + "px";
    if (o.color) d.style.borderColor = o.color;
    d.textContent = o.text || w.id;
    d.dataset.id = w.id;
    dragify(d);
    d.onmousedown = () => select(w.id);
    stage.appendChild(d);
  }
  renderTree();
}

function renderTree() {
  $("#treeList").innerHTML = WIDGETS.map(w => {
    const mod = OVR[w.id] ? " ✏️" : "";
    return `<div style="padding:2px 4px;cursor:pointer;font-size:12px"
      onclick="select('${w.id}')">${w.id}${mod}</div>`;
  }).join("");
}

window.select = id => {
  SELECTED = id;
  const w = WIDGETS.find(x => x.id === id), o = OVR[id] || {};
  $("#insp").innerHTML = `
    <b style="color:var(--acc)">${id}</b>
    <label>x <input type="number" id="px" value="${o.x ?? w?.x ?? 0}"></label>
    <label>y <input type="number" id="py" value="${o.y ?? w?.y ?? 0}"></label>
    <label>w <input type="number" id="pw" value="${o.w ?? w?.w ?? 160}"></label>
    <label>h <input type="number" id="ph" value="${o.h ?? w?.h ?? 24}"></label>
    <label>texto <input type="text" id="ptext" value="${o.text ?? ""}"></label>
    <label>color css <input type="text" id="pcolor" value="${o.color ?? ""}" placeholder="#ff8800"></label>
    <label><input type="checkbox" id="phide" ${o.hidden ? "checked" : ""}> ocultar</label>`;
  ["px","py","pw","ph"].forEach(k => $("#" + k).oninput = apply);
  $("#ptext").oninput = apply;
  $("#pcolor").oninput = apply;
  $("#phide").onchange = apply;
  render();
};

function apply() {
  if (!SELECTED) return;
  OVR[SELECTED] = {
    x:+$("#px").value, y:+$("#py").value,
    w:+$("#pw").value, h:+$("#ph").value,
    text:$("#ptext").value, color:$("#pcolor").value,
    hidden:$("#phide").checked,
  };
  render(); select(SELECTED);
}

function dragify(el) {
  el.onmousedown = e => {
    e.preventDefault();
    const id = el.dataset.id; select(id);
    const sx = e.clientX, sy = e.clientY;
    const w = WIDGETS.find(x => x.id === id), o = OVR[id] ||= {};
    const ox = o.x ?? w?.x ?? parseInt(el.style.left), oy = o.y ?? w?.y ?? parseInt(el.style.top);
    const mv = ev => {
      o.x = Math.round(ox + (ev.clientX - sx) * stageScale());
      o.y = Math.round(oy + (ev.clientY - sy) * stageScale());
      el.style.left = o.x + "px"; el.style.top = o.y + "px";
    };
    const up = () => { document.removeEventListener("mousemove", mv); document.removeEventListener("mouseup", up); select(id); };
    document.addEventListener("mousemove", mv); document.addEventListener("mouseup", up);
  };
}

function stageScale() {
  const r = stage.getBoundingClientRect();
  return r.width / stage.offsetWidth;
}

$("#btnTree").onclick = () => {
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json";
  inp.onchange = async () => {
    const j = JSON.parse(await inp.files[0].text());
    WIDGETS = j.widgets || [];
    render();
  };
  inp.click();
};

$("#btnExport").onclick = () => {
  const lines = [
    "-- overrides.lua — generado por ArcheaAge UI Editor",
    "-- lo consume addon_panel.lua (ivanpanel) al cargar la pantalla.",
    "return {"
  ];
  for (const [id, o] of Object.entries(OVR)) {
    if (o.hidden) lines.push(`  { id = "${id}", action = "hide" },`);
    else {
      const bits = [`anchor = { "TOPLEFT", "UIParent", ${o.x ?? 0}, ${o.y ?? 0} }`];
      if (o.text) bits.push(`text = "${o.text.replace(/"/g, '\\"')}"`);
      if (o.color) {
        const c = hexToRgb01(o.color);
        if (c) bits.push(`color = { ${c.join(", ")} }`);
      }
      lines.push(`  { id = "${id}", action = "apply", ${bits.join(", ")} },`);
    }
  }
  lines.push("}");
  download("overrides.lua", lines.join("\n"));
};

function hexToRgb01(h) {
  const m = /^#?([0-9a-f]{6})$/i.exec(h.trim()); if (!m) return null;
  const n = parseInt(m[1], 16);
  return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255, 1].map(v => +v.toFixed(3));
}

function download(name, content) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([content], { type: "text/plain" }));
  a.download = name; a.click();
}

$("#btnLua").onclick = () => alert(
  "Flujo:\n1) Copia overrides.lua junto a addon_panel.lua (tools/ui/)\n" +
  "2) powershell tools\\ui\\push-ui.ps1\n3) Reabre el juego"
);

render();
</script>
</body>
</html>
