<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArcheaAge Launcher</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #070b14;
        --panel: rgba(255, 255, 255, 0.04);
        --panel-border: rgba(255, 255, 255, 0.08);
        --text: #e8ecf4;
        --muted: #8b94a7;
        --accent: #4f8cff;
        --accent-2: #35e0c8;
        --ok: #3ddc84;
        --warn: #ffb454;
        --danger: #ff5d6c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background:
          radial-gradient(
            1200px 600px at 85% -10%,
            rgba(79, 140, 255, 0.16),
            transparent 60%
          ),
          radial-gradient(
            900px 500px at -10% 110%,
            rgba(53, 224, 200, 0.1),
            transparent 55%
          ),
          linear-gradient(160deg, #0a1120 0%, var(--bg) 55%, #0b0f1a 100%);
        color: var(--text);
        overflow-x: hidden;
      }

      /* ---------- Header ---------- */
      header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 18px 28px;
        border-bottom: 1px solid var(--panel-border);
        backdrop-filter: blur(12px);
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(7, 11, 20, 0.55);
      }

      .logo {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        font-size: 22px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        box-shadow: 0 4px 18px rgba(79, 140, 255, 0.35);
      }

      .brand h1 {
        margin: 0;
        font-size: 19px;
        letter-spacing: 0.4px;
        background: linear-gradient(90deg, #fff, #9db8ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .brand .tagline {
        margin: 0;
        font-size: 11.5px;
        color: var(--muted);
        letter-spacing: 0.6px;
        text-transform: uppercase;
      }

      .conn {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
        padding: 6px 12px;
        border: 1px solid var(--panel-border);
        border-radius: 999px;
        background: var(--panel);
      }

      .conn .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--warn);
      }
      .conn.online .dot {
        background: var(--ok);
        box-shadow: 0 0 8px var(--ok);
        animation: pulse 2s infinite;
      }
      .conn.offline .dot {
        background: var(--danger);
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }

      /* ---------- Layout ---------- */
      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 24px 28px 40px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 16px;
        padding: 20px;
        backdrop-filter: blur(14px);
        animation: fadeUp 0.4s ease both;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .section-title {
        margin: 0 0 14px;
        font-size: 12px;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .section-title::after {
        content: "";
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, var(--panel-border), transparent);
      }

      /* ---------- Versiones ---------- */
      #versions {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 12px;
      }

      .version-card {
        position: relative;
        border: 1px solid var(--panel-border);
        border-radius: 14px;
        padding: 16px;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.02);
        transition:
          transform 0.18s ease,
          border-color 0.18s ease,
          box-shadow 0.18s ease;
        overflow: hidden;
      }
      .version-card::before {
        content: "";
        position: absolute;
        inset: 0 0 auto 0;
        height: 2px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        opacity: 0;
        transition: opacity 0.18s ease;
      }
      .version-card:hover {
        transform: translateY(-3px);
        border-color: rgba(79, 140, 255, 0.45);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      .version-card.active {
        border-color: rgba(79, 140, 255, 0.7);
        background: rgba(79, 140, 255, 0.07);
      }
      .version-card.active::before {
        opacity: 1;
      }

      .version-card .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .version-card h3 {
        margin: 0;
        font-size: 16px;
      }
      .version-card .client {
        margin: 0 0 10px;
        font-size: 12px;
        color: var(--muted);
      }
      .version-card .stats {
        display: flex;
        gap: 10px;
        font-size: 12px;
        color: var(--muted);
      }
      .version-card .stats b {
        color: var(--text);
        font-weight: 600;
      }

      .pill {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        padding: 3px 9px;
        border-radius: 999px;
      }
      .pill.live {
        color: var(--ok);
        background: rgba(61, 220, 132, 0.12);
        border: 1px solid rgba(61, 220, 132, 0.35);
      }
      .pill.beta {
        color: var(--warn);
        background: rgba(255, 180, 84, 0.12);
        border: 1px solid rgba(255, 180, 84, 0.35);
      }
      .pill.maintenance {
        color: var(--danger);
        background: rgba(255, 93, 108, 0.12);
        border: 1px solid rgba(255, 93, 108, 0.35);
      }
      .pill.planned {
        color: var(--muted);
        background: rgba(139, 148, 167, 0.12);
        border: 1px solid rgba(139, 148, 167, 0.35);
      }

      /* ---------- Servidores ---------- */
      .server-row {
        display: grid;
        grid-template-columns: 1fr 110px 130px 130px auto;
        align-items: center;
        gap: 14px;
        padding: 12px 14px;
        border-radius: 12px;
        transition: background 0.15s ease;
      }
      .server-row:hover {
        background: rgba(255, 255, 255, 0.03);
      }
      .server-row + .server-row {
        margin-top: 6px;
      }

      .server-name {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
      }
      .sdot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--muted);
        flex-shrink: 0;
      }
      .sdot.online {
        background: var(--ok);
        animation: pulse 2s infinite;
      }
      .sdot.maintenance {
        background: var(--warn);
      }
      .sdot.offline {
        background: var(--danger);
      }

      .server-status {
        font-size: 12px;
        color: var(--muted);
        text-transform: capitalize;
      }

      .players {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .players .num {
        font-size: 12px;
        color: var(--muted);
      }
      .players .num b {
        color: var(--text);
      }
      .pbar {
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .pbar i {
        display: block;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        transition: width 0.6s ease;
      }

      .btn {
        border: 0;
        border-radius: 10px;
        padding: 9px 22px;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        color: #fff;
        background: linear-gradient(135deg, var(--accent), #3a6fd8);
        box-shadow: 0 4px 14px rgba(79, 140, 255, 0.3);
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease,
          filter 0.15s ease;
      }
      .btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(79, 140, 255, 0.45);
        filter: brightness(1.08);
      }
      .btn:active {
        transform: translateY(0);
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: default;
        transform: none;
      }

      .empty {
        padding: 22px;
        text-align: center;
        color: var(--muted);
        font-size: 13.5px;
      }

      /* ---------- Progreso ---------- */
      #progress.hidden {
        display: none;
      }
      .progress-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 10px;
        font-size: 13px;
      }
      #progress-label {
        color: var(--muted);
      }
      #progress-pct {
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .progress-track {
        height: 8px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.07);
        overflow: hidden;
      }
      #progress-bar {
        height: 100%;
        width: 0;
        border-radius: 4px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        background-size: 200% 100%;
        animation: shimmer 1.4s linear infinite;
        transition: width 0.25s ease;
      }
      @keyframes shimmer {
        from {
          background-position: 200% 0;
        }
        to {
          background-position: -200% 0;
        }
      }

      /* ---------- Footer ---------- */
      footer {
        max-width: 980px;
        margin: 0 auto;
        padding: 0 28px 22px;
        font-size: 12.5px;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      #status.error {
        color: var(--danger);
      }

      @media (max-width: 760px) {
        .server-row {
          grid-template-columns: 1fr auto;
        }
        .server-row > :not(.server-name):not(.btn) {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">⛵</div>
      <div class="brand">
        <h1>ArcheaAge</h1>
        <p class="tagline">Launcher multi-versión</p>
      </div>
      <div class="conn" id="conn">
        <span class="dot"></span><span id="conn-text">registry</span>
      </div>
    </header>

    <main>
      <section class="panel" id="versions-panel">
        <h2 class="section-title">Elige tu versión</h2>
        <div id="versions"></div>
      </section>

      <section class="panel" id="servers-panel">
        <h2 class="section-title">Servidores</h2>
        <div id="servers"></div>
      </section>

      <section class="panel hidden" id="progress">
        <div class="progress-head">
          <span id="progress-label">Preparando client…</span>
          <span id="progress-pct">0%</span>
        </div>
        <div class="progress-track"><div id="progress-bar"></div></div>
      </section>
    </main>

    <footer>
      <span id="status">Conectando al registry…</span>
      <span id="clock"></span>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
