# ArcheaAge dev stack — database.
# `podman compose up -d` (or `docker compose up -d`) starts MariaDB and runs
# the schema migrations automatically, but ONLY on a fresh data volume
# (the official mariadb image executes /docker-entrypoint-initdb.d/* once).
#
# network_mode: host — this podman/WSL2 machine's netavark bridge fails with
# an nftables error, and localhost port-forwarding is broken; the DB is reached
# at the podman VM IP:3306 (start-dev.sh resolves it automatically).
name: archeaage

services:
  db:
    image: mariadb:11.4
    container_name: archeaage-mariadb
    restart: unless-stopped
    network_mode: host
    environment:
      # Root without password — matches the AAEmu Config.Local.json defaults.
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
    volumes:
      - mariadb-data:/var/lib/mysql
      # Auto-migrations: schema SQL + seed (run once on first start).
      - ./servers/aaemu/SQL:/sql-src:ro
      - ./scripts/docker-initdb/01-init-archeaage.sh:/docker-entrypoint-initdb.d/01-init-archeaage.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

volumes:
  mariadb-data:
